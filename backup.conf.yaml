- defaults:
    shell:
      stdout: true
      stderr: true
    link:
      create: true
      relink: true
      force: true

- shell:
  # dependency install
  - description: Make install_backup_dependencies.sh executable
    command: chmod +x ./scripts/install_backup_dependencies.sh

  - description: Run install_backup_dependencies.sh install script
    command: ./scripts/install_backup_dependencies.sh

  # Disable CoW for cache directory in /home
  - description: Remove existing items in /.cache
    command: rm -rf ~/.cache/*

  - description: Apply No-Copy-on-Write to /.cache
    command: chattr +C ~/.cache

  - description: Verify the attribute contains C
    command: lsattr -d ~/.cache

  # Permissions
  - description: Give root permissions to traverse dotfiles
    command: sudo chmod +x ./ ./backup/snapper ./backup/pika

  - description: Make files readable by snapper daemon
    command: sudo chmod 644 ./backup/snapper/* ./backup/pika/*

- link:
    # links for snapper
    /etc/sysconfig/snapper: ./backup/snapper/snapper-sysconfig
    /etc/snapper/configs/root: ./backup/snapper/snapper-root-config
    /etc/snapper/configs/home: ./backup/snapper/snapper-home-config
    /etc/dnf/libdnf5-plugins/snapper.conf: ./backup/snapper/libdnf5-plugin-snapper.conf

    # links for pika
    ~/.var/app/org.gnome.World.PikaBackup/config/pika-backup/backup.json: ./backup/pika/pika-backup.json
